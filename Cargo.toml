[package]
name = "organizer"
version = "0.1.0"
edition = "2024"
description = "TreeSpec parsing and safe, identity-based structural comparison"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
tempfile = "3"

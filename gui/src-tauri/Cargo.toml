[package]
name = "organizer-gui"
version = "0.1.0"
edition = "2024"
description = "TreeSpec Organizer for macOS (docs/GUI_DESIGN.md)"
publish = false

# Independent of the repository root: its own lock file, and the root
# `cargo build`/`cargo test` never builds the GUI.
[workspace]

[lib]
name = "organizer_gui"
path = "src/lib.rs"

[[bin]]
name = "treespec-organizer"
path = "src/main.rs"
required-features = ["app"]

[features]
default = ["app"]
# The Tauri application. Without it, the UI-independent core (sessions,
# commands, view models, settings) builds and tests on any platform.
app = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]

[dependencies]
organizer = { path = "../..", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["no-serde-warnings"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
tauri = { version = "2.12", optional = true, features = [] }
tauri-plugin-dialog = { version = "2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[build-dependencies]
tauri-build = { version = "2.7", optional = true, features = [] }

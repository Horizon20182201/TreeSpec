<!doctype html>
<html lang="zh-Hans" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TreeSpec Organizer · macOS GUI 示例</title>
<!-- 界面示例：静态数据，无网络请求，无外部资源。设计说明见 GUI_DESIGN.md。 -->
<style>
:root{color-scheme:light;--bg:#fbfbfd;--side:rgba(232,235,241,.86);--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#a1a1a6;
--line:rgba(0,0,0,.09);--fill:rgba(0,0,0,.045);--hover:rgba(0,0,0,.06);--card:#fff;--desk:#c9d1db;
--accent:#0a66d9;--accent-soft:rgba(10,102,217,.12);--ok:#1f8a4c;--warn:#b25e00;--bad:#c8312b;--rev:#7a4fc1;
--ok-soft:rgba(31,138,76,.12);--warn-soft:rgba(178,94,0,.12);--bad-soft:rgba(200,49,43,.10);--rev-soft:rgba(122,79,193,.12);
--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;--shadow:0 22px 70px rgba(20,30,50,.28),0 0 0 .5px rgba(0,0,0,.18)}
[data-theme=dark]{color-scheme:dark;--bg:#1f2023;--side:rgba(42,44,49,.9);--ink:#f2f2f4;--ink2:#a1a1aa;--ink3:#6b6b73;
--line:rgba(255,255,255,.1);--fill:rgba(255,255,255,.06);--hover:rgba(255,255,255,.08);--card:#2a2b2f;--desk:#353b44;
--accent:#3d8bff;--accent-soft:rgba(61,139,255,.2);--ok:#40c076;--warn:#f0a23c;--bad:#ff6259;--rev:#b597ff;
--ok-soft:rgba(64,192,118,.16);--warn-soft:rgba(240,162,60,.16);--bad-soft:rgba(255,98,89,.15);--rev-soft:rgba(181,151,255,.16);
--shadow:0 22px 70px rgba(0,0,0,.55),0 0 0 .5px rgba(255,255,255,.14)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Helvetica Neue",sans-serif;
color:var(--ink);background:var(--desk);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
code,.mono{font-family:var(--mono);font-size:12px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:1px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* 演示栏：不属于应用界面 */
#demo{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:10px 20px;font-size:12px;color:#2b3340;
background:rgba(255,255,255,.55);border-bottom:1px solid rgba(0,0,0,.08)}
[data-theme=dark] #demo{color:#d6dbe3;background:rgba(0,0,0,.25)}
#demo b{font-weight:600}
#demo .grp{display:flex;gap:4px;align-items:center}
#demo button{border:1px solid rgba(0,0,0,.14);background:rgba(255,255,255,.7);border-radius:6px;padding:3px 9px;cursor:pointer}
[data-theme=dark] #demo button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15)}
#demo button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
#demo .note{margin-left:auto;opacity:.75}
#desk{padding:26px 24px 40px;display:flex;justify-content:center}
/* 窗口 */
.win{position:relative;width:min(1240px,100%);height:800px;min-width:960px;background:var(--bg);border-radius:12px;
box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-columns:212px 1fr;grid-template-rows:52px 1fr}
.win.noinsp .insp{display:none}
.win.welcome{width:760px;min-width:0;height:520px;grid-template-columns:300px 1fr;grid-template-rows:1fr}
.side{grid-row:1/3;background:var(--side);backdrop-filter:blur(30px);border-right:1px solid var(--line);
display:flex;flex-direction:column;padding:0 10px 10px}
.lights{display:flex;gap:8px;padding:19px 8px 22px}
.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.side h6{margin:6px 8px 4px;font-size:11px;font-weight:600;color:var(--ink3)}
.nav{all:unset;display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:default;font-size:13px}
.nav svg{width:16px;height:16px;flex:none;color:var(--accent)}
.nav:hover{background:var(--hover)}
.nav[aria-current=page]{background:var(--accent-soft)}
.nav .cnt{margin-left:auto;font-size:11px;color:var(--ink2);background:var(--fill);border-radius:9px;padding:0 6px}
.nav.off{color:var(--ink3)}.nav.off svg{color:var(--ink3)}
.nav.alarm,.nav.alarm svg{color:var(--bad)}
.nav.alarm .cnt{background:var(--bad);color:#fff}
.llm{margin-top:auto;padding:8px;border-radius:8px;font-size:11.5px;color:var(--ink2);cursor:default}
.llm:hover{background:var(--hover)}
.llm b{display:block;font-weight:500;color:var(--ink);font-size:12px}
.bar{grid-column:2;display:flex;align-items:center;gap:10px;padding:0 14px 0 18px;border-bottom:1px solid var(--line)}
.bar .title{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.bar .title b{font-size:14px;font-weight:650}
.bar .title span{font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:3px 10px 3px 8px;font-size:12px;
background:var(--fill);border:0;cursor:default;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:var(--ok-soft)}.pill.warn{color:var(--warn);background:var(--warn-soft)}
.pill.bad{color:var(--bad);background:var(--bad-soft)}.pill.mute{color:var(--ink2)}
.pill small{color:var(--ink2);font-size:11px}
.sp{flex:1}
.tb{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:28px;min-width:30px;padding:0 8px;
border:0;border-radius:7px;background:transparent;color:var(--ink2);cursor:default}
.tb:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.tb svg{width:17px;height:17px}
.tb[aria-pressed=true]{color:var(--accent);background:var(--accent-soft)}
.tb:disabled{opacity:.35}
.tb.hot{color:var(--accent);background:var(--accent-soft)}
.body{grid-column:2;display:flex;min-height:0}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.page{flex:1;overflow:auto;padding:16px 20px 24px;min-height:0}
.insp{width:268px;flex:none;border-left:1px solid var(--line);overflow:auto;padding:16px;background:var(--bg)}
.insp h4{margin:0 0 10px;font-size:13px;font-weight:650;word-break:break-all}
.kv{display:grid;grid-template-columns:64px 1fr;gap:5px 10px;font-size:12px;margin:0 0 14px}
.kv dt{color:var(--ink2)}.kv dd{margin:0;word-break:break-all}
.quote{border-left:3px solid var(--rev);background:var(--rev-soft);padding:8px 10px;border-radius:0 6px 6px 0;font-size:12px}
.quote small{display:block;color:var(--ink2);margin-top:4px;font-size:11px}
.empty{color:var(--ink3);font-size:12px;padding:30px 4px;text-align:center}
/* 下一步横幅、卡片、按钮 */
.next{display:flex;align-items:center;gap:12px;margin:12px 20px 0;padding:9px 10px 9px 14px;border-radius:9px;
background:var(--accent-soft);font-size:12.5px}
.next.warn{background:var(--warn-soft)}.next.bad{background:var(--bad-soft)}
.next b{font-weight:600;white-space:nowrap}
.next span{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:6px;border:.5px solid var(--line);
background:var(--card);box-shadow:0 .5px 1px rgba(0,0,0,.12);cursor:default;white-space:nowrap;font-size:12.5px}
.btn:hover:not(:disabled){filter:brightness(.97)}
.btn.pri{background:var(--accent);color:#fff;border-color:transparent}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn:disabled{opacity:.4}
.btn.sm{height:22px;padding:0 9px;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h2{margin:0 0 2px;font-size:20px;font-weight:700;letter-spacing:-.01em}
h3{margin:18px 0 8px;font-size:13px;font-weight:650}
.sub{color:var(--ink2);margin:0 0 14px}
.card{background:var(--card);border:.5px solid var(--line);border-radius:10px;padding:14px 16px}
.hero{display:flex;gap:16px;align-items:center}
.hero .big{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.hero .big svg{width:22px;height:22px}
.hero.ok .big{background:var(--ok-soft);color:var(--ok)}.hero.warn .big{background:var(--warn-soft);color:var(--warn)}
.hero.bad .big{background:var(--bad-soft);color:var(--bad)}
.hero h2{font-size:17px}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:16px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{all:unset;display:block;padding:10px 12px;border-radius:9px;background:var(--fill);cursor:default}
.tile b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tile span{font-size:11.5px;color:var(--ink2)}
.tile.on{background:var(--accent-soft)}.tile.zero b{color:var(--ink3)}
.list{border:.5px solid var(--line);border-radius:9px;background:var(--card);overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:7px 12px;border-top:.5px solid var(--line);font-size:12.5px;cursor:default}
.li:first-child{border-top:0}
.li:hover{background:var(--hover)}
.li .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li.sel{background:var(--accent-soft)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;border-radius:5px;padding:1px 6px;white-space:nowrap;
background:var(--fill);color:var(--ink2)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.rev{background:var(--rev-soft);color:var(--rev)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.badge b{font-family:var(--mono);font-weight:700}
.muted{color:var(--ink2)}.tiny{font-size:11.5px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;font-weight:500;color:var(--ink2);font-size:11.5px;padding:6px 10px;border-bottom:.5px solid var(--line)}
td{padding:6px 10px;border-bottom:.5px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.err{font-family:var(--mono);font-size:11.5px;background:var(--fill);border-radius:7px;padding:9px 11px;white-space:pre-wrap;word-break:break-all}
.hint{font-size:12px;color:var(--ink2);margin-top:6px}
/* 大纲 */
.tree{border:.5px solid var(--line);border-radius:9px;background:var(--card);padding:4px 0;font-size:12.5px}
.tr{display:grid;grid-template-columns:minmax(0,1fr) 150px 108px;align-items:center;height:26px;padding-right:10px;cursor:default}
.tr.two{grid-template-columns:minmax(0,1fr) auto}
.tr:hover{background:var(--hover)}.tr[aria-selected=true]{background:var(--accent-soft)}
.tr .nm{display:flex;align-items:center;gap:5px;min-width:0;white-space:nowrap}
.tr .nm span{overflow:hidden;text-overflow:ellipsis}
.tw{width:14px;flex:none;color:var(--ink3);text-align:center;font-size:10px}
.tr .ic{width:15px;height:15px;flex:none}
.tr .ds{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.tr .mk{justify-self:end}
.tr.gone .nm span{text-decoration:line-through;color:var(--ink2)}
.tr input{margin:0 2px 0 0}
.tr .lock{color:var(--ink3)}
.scope{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 12px;border-radius:9px;background:var(--fill);font-size:12px}
.search{height:26px;border-radius:7px;border:.5px solid var(--line);background:var(--card);padding:0 10px;width:200px}
/* 整理页 */
.org{display:flex;flex:1;min-height:0}
.rounds{width:236px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:12px 10px;display:flex;flex-direction:column}
.rounds h6{margin:10px 6px 4px;font-size:11px;font-weight:600;color:var(--ink3)}
.rd{all:unset;display:block;padding:7px 9px;border-radius:7px;cursor:default}
.rd:hover{background:var(--hover)}.rd[aria-current=true]{background:var(--accent-soft)}
.rd b{display:block;font-weight:600;font-size:12.5px}
.rd .row{gap:4px;margin-top:3px}
.rounds .foot{margin-top:auto;display:flex;gap:6px;padding:10px 4px 0}
.detail{flex:1;min-width:0;overflow:auto;padding:14px 20px 24px}
.steps{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);margin-bottom:12px}
.steps span{display:inline-flex;align-items:center;gap:5px}
.steps span i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10.5px;
background:var(--fill);color:var(--ink2);font-weight:600}
.steps .done{color:var(--ink2)}.steps .done i{background:var(--ok-soft);color:var(--ok)}
.steps .cur{color:var(--ink);font-weight:600}.steps .cur i{background:var(--accent);color:#fff}
.steps em{width:22px;height:1px;background:var(--line)}
.seg{display:inline-flex;background:var(--fill);border-radius:7px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:5px;padding:3px 14px;font-size:12px;cursor:default}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 .5px 2px rgba(0,0,0,.18)}
.seg button:disabled{color:var(--ink3)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:8px;background:var(--warn-soft);font-size:12.5px;margin:10px 0}
.notice svg{width:16px;height:16px;flex:none;color:var(--warn);margin-top:1px}
.notice.bad{background:var(--bad-soft)}.notice.bad svg{color:var(--bad)}
.notice.info{background:var(--accent-soft)}.notice.info svg{color:var(--accent)}
/* 编辑器 */
.ed{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.code{display:flex;border:.5px solid var(--line);border-radius:9px;background:var(--card);overflow:hidden;font-family:var(--mono);font-size:12.5px;line-height:20px}
.gut{padding:8px 0;background:var(--fill);color:var(--ink3);text-align:right;user-select:none;min-width:38px}
.gut div{padding:0 8px}.gut .e{background:var(--bad);color:#fff}.gut .ro{color:var(--rev)}
.code textarea{flex:1;border:0;outline:0;resize:none;background:transparent;padding:8px 10px;line-height:20px;
font:inherit;white-space:pre;overflow:auto;tab-size:2;min-height:320px}
.chk{font-size:12px}.chk li{margin:3px 0}
.chk ul{margin:4px 0 10px;padding-left:16px}
/* 工作表（sheet）与活动日志 */
.veil{position:absolute;inset:52px 0 0 0;background:rgba(0,0,0,.18);display:flex;justify-content:center;align-items:flex-start;z-index:5}
.win.welcome .veil{inset:0}
.sheet{width:560px;max-height:calc(100% - 20px);overflow:auto;background:var(--bg);border-radius:0 0 12px 12px;
box-shadow:0 18px 50px rgba(0,0,0,.3),0 0 0 .5px var(--line);padding:18px 20px 16px}
.sheet.anim{animation:drop .18s ease-out}
@keyframes drop{from{transform:translateY(-14px);opacity:.4}}
.sheet h3{margin:0 0 4px;font-size:14px}
.sheet .kv{grid-template-columns:76px 1fr}
.sheet .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;align-items:center}
.sheet .acts .muted{margin-right:auto;font-size:11.5px}
.sheet label.ck{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;margin:8px 0}
.sheet label.ck input{margin-top:3px}
.sheet .fld{display:grid;grid-template-columns:76px 1fr;gap:6px 10px;align-items:start;margin:8px 0;font-size:12.5px}
.sheet .fld>span:first-child{color:var(--ink2);padding-top:4px}
.inp{width:100%;border:.5px solid var(--line);border-radius:6px;background:var(--card);padding:4px 8px;min-height:26px}
textarea.inp{min-height:62px;resize:vertical}
.cmd{position:relative;font-family:var(--mono);font-size:11.5px;background:var(--fill);border-radius:7px;padding:8px 52px 8px 10px;word-break:break-all;margin-top:4px}
.cmd button{position:absolute;right:6px;top:6px}
.prog{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin:12px 0 6px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s}
.log{border-top:1px solid var(--line);height:150px;flex:none;overflow:auto;font-size:12px;background:var(--bg)}
.log .hd{position:sticky;top:0;display:flex;align-items:center;padding:6px 14px;background:var(--bg);border-bottom:.5px solid var(--line);font-weight:600}
.log .en{display:grid;grid-template-columns:52px 96px 1fr 80px;gap:10px;padding:5px 14px;border-bottom:.5px solid var(--line)}
.log .en code{word-break:break-all;color:var(--ink2)}
.log .en .badge{align-self:start;justify-self:start}
/* 欢迎窗口 */
.wl{grid-row:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30px;text-align:center;
background:var(--side);border-right:1px solid var(--line)}
.wl .lights{position:absolute;left:10px;top:0}
.appicon{width:84px;height:84px;border-radius:20px;background:linear-gradient(160deg,#3a8dff,#1b55c4);display:grid;place-items:center;
box-shadow:0 6px 18px rgba(16,70,170,.35)}
.appicon svg{width:48px;height:48px;color:#fff}
.wl h2{margin:6px 0 0}
.wr{padding:22px 18px;overflow:auto}
.drop{margin-top:12px;border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--ink2);font-size:12px}
.ctx{position:absolute;z-index:6;min-width:190px;background:var(--bg);border-radius:8px;padding:4px;box-shadow:0 10px 30px rgba(0,0,0,.25),0 0 0 .5px var(--line)}
.ctx button{all:unset;display:block;padding:4px 10px;border-radius:5px;font-size:12.5px;cursor:default}
.ctx button:hover{background:var(--accent);color:#fff}
.tip{border-bottom:1px dotted var(--ink3)}
</style>
</head>
<body>
<div id="demo" role="toolbar" aria-label="演示控制（不属于应用界面）">
  <b>演示场景</b>
  <div class="grp" id="scn">
    <button data-a="scn" data-v="welcome">欢迎窗口</button>
    <button data-a="scn" data-v="uninit">未初始化</button>
    <button data-a="scn" data-v="clean">已同步 · 有整理轮次</button>
    <button data-a="scn" data-v="changed">磁盘有变化</button>
    <button data-a="scn" data-v="unfinished">迁移未完成</button>
  </div>
  <div class="grp"><b>外观</b>
    <button data-a="theme" data-v="light">浅色</button><button data-a="theme" data-v="dark">深色</button>
  </div>
  <span class="note">静态示例数据，不读写任何文件。建议从“已同步”开始，走一遍“生成计划 → 预览 → 执行 → 归档”。</span>
</div>
<div id="desk"><div id="app"></div></div>
<script>
"use strict";
// ---------- 图标（24×24 描边） ----------
const P={
 overview:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
 structure:'M5 4v16M5 6h4M5 12h4M5 18h4M12 6h8M12 12h8M12 18h8',
 organize:'M4 7h13M14 4l3 3-3 3M20 17H7M10 14l-3 3 3 3',
 history:'M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',
 recovery:'M12 3l9.5 17h-19zM12 10v4.5M12 17.5v.01',
 refresh:'M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7',
 plus:'M12 5v14M5 12h14',
 log:'M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01',
 insp:'M4 5h16v14H4zM15 5v14',
 folder:'M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z',
 file:'M6.5 3h7.5l4.5 4.5V21h-12zM14 3v4.5h4.5',
 lock:'M7.5 11V8.5a4.5 4.5 0 0 1 9 0V11M5.5 11h13v9h-13z',

// ---------- TreeSpec 极简解析（示例用；真实实现调用库的 parse_tree_with_base / compare_trees） ----------
function parse(text){
 const lines=text.split('\n'),nodes=[],errs=[],stack=[];
 lines.forEach((ln,i)=>{const no=i+1;if(!ln.trim()||/^\s*#/.test(ln))return;
  if(ln.startsWith('!tree')){if(ln!=='!tree 1')errs.push([no,'只支持 !tree 1']);return}
  const m=ln.match(/^( *)("(?:[^"\\]|\\.)*"|[^ @#/][^@#]*?)(\/)?(?: @([A-Za-z0-9_-]+))?(?: #\s?(.*))?$/);
  if(!m){errs.push([no,'无法解析这一行']);return}
  const sp=m[1].length,d=sp/2;
  if(sp%2||d>stack.length){errs.push([no,'缩进必须是两个空格一层，且不能跳级']);return}
  stack.length=d;const parent=d?stack[d-1]:null;
  if(parent!=null&&!nodes[parent].dir){errs.push([no,'文件不能有子节点']);return}
  const name=m[2].trim().replace(/^"|"$/g,'');
  nodes.push({no,d,name,dir:!!m[3],id:m[4]||null,desc:(m[5]||'').trim(),parent});stack.push(nodes.length-1);
 });
 return {nodes,errs};
}
function check(text){
 const {nodes,errs}=parse(text),seen=new Set(nodes.map(n=>n.id).filter(Boolean)),marks=[],ops=[];
 const pid=n=>n.parent==null?null:nodes[n.parent].id,path=n=>(n.parent==null?'':path(nodes[n.parent])+'/')+n.name;
 nodes.forEach(n=>{const b=n.id&&byId[n.id];
  if(!n.id){marks.push(n.dir?'+':'!');if(n.dir)ops.push(['mkdir',path(n).replace(/^\//,'')]);return}
  if(!b){marks.push(n.dir?'+':'!');if(n.dir)ops.push(['mkdir',path(n).replace(/^\//,'')]);return}
  if(b.parent!==pid(n)){marks.push('>');ops.push([n.dir?'move_directory':'move_file',pathOf(n.id),path(n).replace(/^\//,'')]);return}
  if(b.name!==n.name){marks.push('~');ops.push([n.dir?'move_directory':'move_file',pathOf(n.id),path(n).replace(/^\//,'')]);return}
  marks.push(b.desc!==n.desc?'#':'');
 });
 const missing=BASE.filter(b=>!seen.has(b.id)),newFiles=nodes.filter(n=>!n.dir&&!(n.id&&byId[n.id]));
 return {nodes,errs,marks,ops,missing,newFiles};
}

  log('归档',`organizer archive --root ${q(ROOT)} ${v?files.filter(x=>!x.endsWith('.review.json')).map(q).join(' '):'--all'}`);
  if(v)S.rounds=S.rounds.filter(r=>r.name!==v);else{S.rounds=[];S.unpaired=[]}
  S.round=S.rounds[0]?.name;close();toast('已归档到 .organizer/archive/，没有删除任何文件')},
 doCopy:()=>{const name=S.form.name||'new.tree';if(S.rounds.some(r=>r.name===name)){toast(name+' 已存在，请换一个名称');return}
  const t=baseText();S.rounds.push({name,src:'手工',stage:'无变化',ack:null,plan:null,preview:null,text:t,saved:t});
  log('复制当前结构',`cp -n ${q(OZ+'/structure.tree')} ${q(OZ+'/drafts/'+name)}`);S.page='organize';S.round=name;S.seg='edit';close()},
 doPlan:(v)=>{const r=S.rounds.find(x=>x.name===v),c=r.src==='LLM'?null:check(r.saved);
  const cmd=`organizer plan --root ${q(ROOT)} --from ${q(OZ+'/structure.tree')} --to ${q(OZ+'/drafts/'+v)}${r.ack?' --acknowledge-review':''} --out …`;
  if(c&&(c.missing.length||c.newFiles.length||c.errs.length)){log('生成计划',cmd,'有未解决项');close();toast('计划有未解决项，没有写入文件。回到编辑修正。');return}
  const name=v.replace(/\.tree$/,r.ack?'.reviewed.json':'.json'),ops=opsFor(r);
  r.plan={name,ops,sha:'41a9d0e3'};r.stage=ops.length?'可执行':'无需执行';r.preview=null;
  log('生成计划',cmd);S.round=v;S.seg='plan';close()},
 doApply:(v)=>{const r=S.rounds.find(x=>x.name===v);S.form={stage:'run',k:1};render();
  const t=setInterval(()=>{if(S.form.k<r.plan.ops.length){S.form.k++;render();return}clearInterval(t);
   r.stage='已执行';S.form={stage:'done'};S.commits.unshift(['e19b2c4','refactor',`apply plan sha256:41a9d0e3 (${v})`]);S.runs.unshift(['run_c41e9a07','sha256:41a9d0e3','complete',r.plan.ops.length,r.plan.ops.length]);
   log('执行迁移',`organizer apply ${q(OZ+'/plans/'+r.plan.name)} --root ${q(ROOT)} --yes`);render()},650)},
 doChat:()=>{S.form.wait=5;render();const t=setInterval(()=>{S.form.wait+=19;if(S.form.wait<100){render();return}clearInterval(t);
  const name='chat_3fa1c09d.tree';if(!S.rounds.some(r=>r.name===name))S.rounds.unshift({name,src:'LLM',stage:'待计划',ack:'有 1 个待审核项',plan:null,preview:null,text:PAPERS_TEXT,saved:PAPERS_TEXT});
  log('生成 LLM 草案',`organizer chat --root ${q(ROOT)} --classify --out ${q(OZ+'/drafts/'+name)} …`,'有待审核项');
  S.page='organize';S.round=name;S.seg='review';S.rsel='notes.pdf';close();toast('草案已生成，有 1 个待审核项，已选中')},400)},
 doResolve:()=>{log('标记已人工处理',`organizer recover ${RUN.id} --root ${q(ROOT)} --mark-resolved`);S.runs.unshift([RUN.id,RUN.plan,'resolved',RUN.done,RUN.total]);
  Object.assign(S,{unfinished:false,changes:{added:[],missing:[],moved:[['Research/Papers/CRUSH.pdf','Research/Papers/C2Rust/CRUSH.pdf']],changed:[],unknown:[]},page:'overview',tab:'moved'});
  S.rounds.forEach(r=>{r.stage='计划已过期';r.plan=r.plan||{name:'papers.reviewed.json',ops:PAPERS_OPS,sha:'41a9d0e3'}});close();toast('已关闭这次运行。下一步：归档，再同步。')},
 doExport:()=>{log('导出脚本',`organizer export-script ${q(OZ+'/plans/'+cur().plan.name)} --out ${q(OZ+'/plans/'+cur().plan.name.replace(/\.json$/,'.sh'))}`);close();toast('已导出。脚本只调用不带 --yes 的 apply。')},
};
// ---------- 事件 ----------
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-a]');if(!el||el.disabled||el.getAttribute('aria-disabled')==='true'&&el.dataset.a!=='go')return;
 if(el.tagName==='LABEL')return;
 const f=ACT[el.dataset.a];if(f){if(el.tagName!=='INPUT')e.preventDefault();f(el.dataset.v,el)}
});
function keepFocus(sel,fn){const a=document.activeElement,s=a.selectionStart,en=a.selectionEnd;fn();const b=document.querySelector(sel);if(b){b.focus();try{b.setSelectionRange(s,en)}catch(_){}}}
document.addEventListener('input',e=>{
 const k=e.target.dataset.in;if(!k)return;
 if(k==='src'){const r=cur(),ta=e.target;
  if(r.src==='LLM'){const first=r.saved.split('\n')[0];if(!ta.value.startsWith(first+'\n')){const p=ta.selectionStart;ta.value=first+'\n'+ta.value.split('\n').slice(1).join('\n');ta.selectionStart=ta.selectionEnd=p;toast('第 1 行是审核标记，不能修改')}}
  r.text=ta.value;clearTimeout(S.chkT);
  document.getElementById('gut').innerHTML=gutter(r.text,parse(r.text).errs);
  S.chkT=setTimeout(()=>{const c=document.getElementById('chk');if(c)c.innerHTML=checkPanel(r);
   document.querySelector('[data-a=save]').disabled=document.querySelector('[data-a=revert]').disabled=r.text===r.saved;
   document.getElementById('dirty').textContent=(r.text===r.saved?'已保存':'有未保存的修改')+' · drafts/'+r.name},300);return}
 if(e.isComposing)return;                    // 输入法组合期间不重绘
 if(k==='q'){S.q=e.target.value;keepFocus('[data-in=q]',render);return}
 S.form[k]=e.target.value;keepFocus(`[data-in=${k}]`,render);
});
document.addEventListener('compositionend',e=>{if(e.target.dataset?.in&&e.target.dataset.in!=='src')e.target.dispatchEvent(new Event('input',{bubbles:true}))});
document.addEventListener('scroll',e=>{if(e.target.id==='src')document.getElementById('gut').scrollTop=e.target.scrollTop},true);
document.addEventListener('keydown',e=>{
 if(e.isComposing||e.keyCode===229)return;   // Return/Esc 交给输入法
 if(S.sheet){if(e.key==='Escape'){e.preventDefault();ACT.close();return}
  if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox'){e.preventDefault();return}   // 文本框中的 Return 不触发任何按钮
  if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();ACT.close();return}}             // 其他位置 Return = 取消
 if(e.metaKey&&e.key>='1'&&e.key<='5'){e.preventDefault();ACT.go(PAGES[e.key-1][0]);return}
 if(e.metaKey&&e.key==='s'&&S.page==='organize'&&S.seg==='edit'){e.preventDefault();if(cur().text!==cur().saved)ACT.save();return}
 const el=e.target.closest?.('[data-a]');
 if(el&&(e.key==='Enter'||e.key===' ')&&!['BUTTON','INPUT','TEXTAREA','LABEL'].includes(el.tagName)){e.preventDefault();el.click()}
});
scenario('clean');
</script>

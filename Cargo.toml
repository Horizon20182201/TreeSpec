[package]
name = "organizer"
version = "0.1.0"
edition = "2024"
description = "TreeSpec parsing and safe, identity-based structural comparison"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
sha2 = "0.10"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ratatui = { version = "0.30", optional = true, default-features = false, features = ["crossterm"] }
unicode-width = { version = "0.2", optional = true }

[features]
default = ["tui"]
# Interactive terminal front end (`organizer tui`). Disable for a CLI-only build.
tui = ["dep:ratatui", "dep:unicode-width"]

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1", features = ["fs"] }
